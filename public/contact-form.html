<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Formulário de Contato (Definição para Netlify)</title>
</head>
<body>
  <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" netlify-hidden>
    <input type="hidden" name="form-name" value="contact" />
    <p style="display:none;">
      <label>
        Não preencha isto se você for humano: <input name="bot-field" />
      </label>
    </p>
    <div>
      <label htmlFor="name">Nome:</label>
      <input type="text" id="name" name="name" />
    </div>
    <div>
      <label htmlFor="email">Email:</label>
      <input type="email" id="email" name="email" />
    </div>
    <div>
      <label htmlFor="message">Mensagem:</label>
      <textarea id="message" name="message"></textarea>
    </div>
    <div>
      <button type="submit">Enviar</button>
    </div>
  </form>
</body>
</html>
